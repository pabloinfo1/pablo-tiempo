<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>Pablómetro</title>
    
    <!-- Etiquetas Open Graph -->
    <meta property="og:title" content="Pablómetro" />
    <meta property="og:description" content="El tiempo oficial de la AEMET, pero con buen gusto. Una aplicación meteorológica ultraligera y minimalista." />
    <meta property="og:image" content="favicon.png" />
    
    <style>
        :root {
            --bg-color: #fbfdf8;
            --surface: #f0f3eb;
            --surface-high: #e9ece3;
            --primary: #386a20;
            --text-main: #1a1c18;
            --text-muted: #43483e;
            --border-radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start; /* Alineado arriba por si el texto ocupa varias líneas */
            margin-bottom: 30px;
        }

        /* Título sin truncar */
        #location-name {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
            white-space: normal; /* Permite saltos de línea */
            word-wrap: break-word;
            line-height: 1.2;
            flex: 1;
            padding-right: 15px;
        }

        button.icon-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--primary);
            padding: 5px;
        }

        h2 { font-size: 1.2rem; margin-bottom: 15px; color: var(--text-muted); }

        /* Contenedor scroll horizontal para horas */
        .hourly-scroll {
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding-bottom: 10px;
            scrollbar-width: none;
        }
        .hourly-scroll::-webkit-scrollbar { display: none; }

        .hourly-card {
            background: var(--surface);
            padding: 15px;
            border-radius: var(--border-radius);
            min-width: 85px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .hourly-time { font-weight: 600; }
        .hourly-temp { font-size: 1.2rem; font-weight: bold; }
        .hourly-precip { font-size: 0.85rem; color: #0066cc; }

        /* Datos extra minimalistas */
        .extra-data-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--surface-high);
            width: 100%;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: left;
        }

        .extra-item { display: flex; justify-content: space-between; gap: 8px; }

        /* Días clickables */
        .daily-list { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .daily-card {
            background: var(--surface);
            padding: 15px 20px;
            border-radius: var(--border-radius);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .daily-card:hover { background: var(--surface-high); }

        /* Modal/Menús */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex; justify-content: center; align-items: flex-end;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
            z-index: 100;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        
        .modal-content {
            background: var(--bg-color);
            width: 100%; max-width: 600px;
            border-radius: 24px 24px 0 0;
            padding: 25px;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .close-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-muted); }

        /* Estilos Menú Ajustes */
        .settings-option {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0; border-bottom: 1px solid var(--surface-high);
        }
        .settings-btn {
            display: block; width: 100%; padding: 15px; margin-top: 20px;
            background: var(--surface); color: var(--text-main);
            text-align: center; text-decoration: none; font-weight: 600;
            border-radius: 12px; transition: background 0.2s;
        }
        .settings-btn:hover { background: var(--surface-high); }

        /* Toggle Switch CSS minimalista */
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc; transition: .4s; border-radius: 24px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px;
            left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(20px); }

    </style>
</head>
<body>

    <header>
        <h1 id="location-name">Cargando ubicación...</h1>
        <button id="btn-settings" class="icon-btn">⚙️</button>
    </header>

    <main>
        <section>
            <h2>Próximas horas</h2>
            <div id="upcoming-hours" class="hourly-scroll">
                <!-- Se inyectará por JS -->
            </div>
        </section>

        <section>
            <div class="daily-list" id="next-days">
                <h2>Próximos días</h2>
                <!-- Se inyectará por JS -->
            </div>
        </section>
    </main>

    <!-- Modal Detalles del Día -->
    <div id="modal-day" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-day-title">Detalle del día</h2>
                <button class="close-btn" onclick="closeModal('modal-day')">✕</button>
            </div>
            <div id="modal-day-hours" class="hourly-scroll">
                <!-- Horas del día clickado inyectadas por JS -->
            </div>
        </div>
    </div>

    <!-- Modal Ajustes -->
    <div id="modal-settings" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Opciones de visualización</h2>
                <button class="close-btn" onclick="closeModal('modal-settings')">✕</button>
            </div>
            <div id="settings-container">
                <!-- Toggles inyectados por JS -->
            </div>
            
            <a href="https://www.aemet.es" target="_blank" class="settings-btn">Datos obtenidos de AEMET</a>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
