<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>El Tiempo</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/jpg" href="favicon.jpg" />
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />
  
  <style>
    /* Motor de Tema Adaptativo (Claro / Oscuro) */
    :root {
      --md-surface: #fbfdf8;
      --md-surface-container: #f0f3eb;
      --md-surface-container-high: #e9ece3;
      --md-primary: #386a20;
      --text-main: #0f172a; /* slate-900 */
      --text-muted: #475569; /* slate-600 */
      --border-color: rgba(226, 232, 240, 0.6);
    }
    
    @media (prefers-color-scheme: dark) {
      :root {
        --md-surface: #11140e;
        --md-surface-container: #1e201b;
        --md-surface-container-high: #282b25;
        --md-primary: #9cd67d;
        --text-main: #f8fafc; /* slate-50 */
        --text-muted: #94a3b8; /* slate-400 */
        --border-color: rgba(51, 65, 85, 0.6);
      }
    }

    body { 
      background-color: var(--md-surface); 
      color: var(--text-main);
      font-family: system-ui, -apple-system, sans-serif; 
    }
    
    .material-symbols-rounded { font-variation-settings: 'FILL' 1; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'md-surface': 'var(--md-surface)',
            'md-surface-container': 'var(--md-surface-container)',
            'md-surface-container-high': 'var(--md-surface-container-high)',
            'md-primary': 'var(--md-primary)',
            'text-main': 'var(--text-main)',
            'text-muted': 'var(--text-muted)',
            'border-color': 'var(--border-color)',
          },
          borderRadius: {
            'md-card': '24px',
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen p-4 md:p-8 max-w-2xl mx-auto relative pb-28">

  <header class="relative flex justify-center items-center mb-6 pt-2 h-12">
    <div class="absolute left-0 flex items-center gap-1.5 text-md-primary">
      <span class="material-symbols-rounded text-3xl">routine</span>
      <span class="font-bold text-lg tracking-tight hidden sm:block">Weather</span>
    </div>
    
    <h1 id="ui-municipio" class="text-2xl font-medium tracking-tight truncate max-w-[180px] sm:max-w-xs text-center">
      Cargando...
    </h1>
  </header>

  <section class="bg-md-surface-container-high rounded-md-card p-6 mb-6 flex flex-col items-center justify-center shadow-sm">
    <span id="ui-icono-actual" class="material-symbols-rounded text-6xl text-md-primary mb-2">cloud</span>
    <div class="flex items-start">
      <span id="ui-temp-actual" class="text-6xl font-normal tracking-tighter">--</span>
      <span class="text-2xl mt-1">°</span>
    </div>
    <p id="ui-desc-actual" class="text-lg mt-1 font-medium capitalize">--</p>
    <div class="flex gap-4 mt-4 text-sm font-medium text-text-muted">
      <div class="flex items-center gap-1"><span class="material-symbols-rounded text-base">water_drop</span> <span id="ui-humedad">--%</span></div>
      <div class="flex items-center gap-1"><span class="material-symbols-rounded text-base">air</span> <span id="ui-viento">-- km/h</span></div>
    </div>
  </section>

  <h2 class="text-sm font-semibold ml-2 mb-3 text-text-muted uppercase tracking-wider">Próximas horas</h2>
  <section id="ui-carrusel-horas" class="flex gap-3 overflow-x-auto no-scrollbar pb-2 mb-8 snap-x">
  </section>

  <h2 class="text-sm font-semibold ml-2 mb-3 text-text-muted uppercase tracking-wider">Próximos días</h2>
  <section id="ui-lista-dias" class="bg-md-surface-container rounded-md-card overflow-hidden mb-6">
  </section>

  <!-- Píldora de Navegación Flotante Horizontal -->
  <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-md-surface/80 backdrop-blur-lg shadow-lg border border-border-color rounded-full p-1.5 flex items-center gap-1 z-40">
    <button class="flex items-center gap-2 px-5 py-2.5 bg-md-surface-container-high rounded-full transition">
      <span class="material-symbols-rounded text-[22px] text-md-primary" style="font-variation-settings: 'FILL' 1;">partly_cloudy_day</span>
      <span class="text-sm font-semibold text-md-primary">Tiempo</span>
    </button>
    
    <button id="btn-search" class="flex items-center gap-2 px-5 py-2.5 hover:bg-md-surface-container/50 rounded-full transition text-text-muted hover:text-text-main">
      <span class="material-symbols-rounded text-[22px]" style="font-variation-settings: 'FILL' 0;">search</span>
      <span class="text-sm font-semibold">Buscar</span>
    </button>
    
    <button id="btn-options" class="flex items-center gap-2 px-5 py-2.5 hover:bg-md-surface-container/50 rounded-full transition text-text-muted hover:text-text-main">
      <span class="material-symbols-rounded text-[22px]" style="font-variation-settings: 'FILL' 0;">settings</span>
      <span class="text-sm font-semibold">Opciones</span>
    </button>
  </nav>

  <!-- Modal de Búsqueda -->
  <div id="search-modal" class="fixed inset-0 bg-md-surface z-50 hidden flex-col transition-opacity">
    <div class="p-4 flex gap-3 items-center border-b border-border-color bg-md-surface">
      <button id="btn-close-search" class="p-2 rounded-full hover:bg-md-surface-container transition flex items-center justify-center">
        <span class="material-symbols-rounded text-text-muted">arrow_back</span>
      </button>
      <input type="text" id="search-input" placeholder="Buscar ciudad o código postal..." 
             class="flex-1 bg-transparent text-lg outline-none placeholder:text-text-muted text-text-main" autocomplete="off">
    </div>
    
    <button id="btn-gps" class="w-full p-4 flex items-center gap-3 border-b border-border-color hover:bg-md-surface-container active:bg-md-surface-container transition text-left text-md-primary">
      <span class="material-symbols-rounded" id="icono-gps">my_location</span>
      <span class="font-medium text-lg" id="texto-gps">Usar mi ubicación actual</span>
    </button>

    <div id="search-results" class="flex-1 overflow-y-auto pb-24">
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
