<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Fondo Slate general -->
    <radialGradient id="ogBg" cx="30%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#141c2e" />
      <stop offset="100%" stop-color="#0a0f18" />
    </radialGradient>

    <!-- Resplandor del sol -->
    <radialGradient id="sunGlowOg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#f97316" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0a0f18" stop-opacity="0" />
    </radialGradient>

    <!-- Sol -->
    <linearGradient id="sunGradOg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed766" />
      <stop offset="35%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Rayos del sol -->
    <linearGradient id="rayGradOg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed766" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <!-- Capas de la nube -->
    <linearGradient id="clBackLeft" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#1d75f2" />
      <stop offset="100%" stop-color="#0d47a1" />
    </linearGradient>

    <linearGradient id="clRightBase" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#3b8bf6" />
      <stop offset="100%" stop-color="#155dc6" />
    </linearGradient>

    <linearGradient id="clTopLeft" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#5ca4ff" />
      <stop offset="100%" stop-color="#1d6fee" />
    </linearGradient>

    <linearGradient id="clFrontLobe" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#8ac6ff" />
      <stop offset="40%" stop-color="#55a5ff" />
      <stop offset="100%" stop-color="#2172f3" />
    </linearGradient>

    <linearGradient id="clRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <filter id="softShadowOg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#030712" flood-opacity="0.7" />
    </filter>
  </defs>

  <style>
    .font-title { font-family: 'Outfit', 'Google Sans', system-ui, sans-serif; font-weight: 700; fill: #f8fafc; }
    .font-sub { font-family: 'Outfit', 'Google Sans', system-ui, sans-serif; font-weight: 400; fill: #94a3b8; }
    .font-badge { font-family: 'Outfit', 'Google Sans', system-ui, sans-serif; font-weight: 600; fill: #60a5fa; }
  </style>

  <!-- Fondo base -->
  <rect width="1200" height="630" fill="url(#ogBg)" />

  <!-- ================= GRUPO ICONO (IZQUIERDA) ================= -->
  <g transform="translate(60, 85) scale(0.92)">
    <!-- Halo del sol -->
    <circle cx="316" cy="226" r="140" fill="url(#sunGlowOg)" />

    <!-- Rayos del sol -->
    <g stroke="url(#rayGradOg)" stroke-width="14" stroke-linecap="round">
      <line x1="264" y1="172" x2="252" y2="157" />
      <line x1="316" y1="150" x2="316" y2="132" />
      <line x1="368" y1="172" x2="381" y2="157" />
      <line x1="390" y1="226" x2="408" y2="226" />
    </g>

    <!-- Núcleo del sol -->
    <circle cx="316" cy="226" r="54" fill="url(#sunGradOg)" filter="url(#softShadowOg)" />
    <circle cx="316" cy="226" r="53" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2" />

    <!-- Nube multicapa -->
    <g filter="url(#softShadowOg)">
      <!-- Capa 1: Posterior izquierda -->
      <path fill="url(#clBackLeft)" d="
        M 148 358
        C 120 358 108 334 116 304
        C 126 270 156 252 188 252
        C 200 252 216 256 228 264
        C 208 300 186 358 148 358
        Z" />

      <!-- Capa 2: Base derecha -->
      <path fill="url(#clRightBase)" d="
        M 160 358
        H 344
        C 374 358 392 340 388 312
        C 384 286 362 268 334 268
        C 318 268 276 274 246 294
        C 214 316 178 358 160 358
        Z" />

      <!-- Capa 3: Superior izquierda -->
      <path fill="url(#clTopLeft)" d="
        M 142 344
        C 124 314 136 272 166 244
        C 192 218 234 208 266 220
        C 292 230 308 252 314 274
        C 280 262 238 272 208 300
        C 178 328 152 342 142 344
        Z" />

      <!-- Capa 4: Frontal translúcido -->
      <path fill="url(#clFrontLobe)" d="
        M 152 358
        H 326
        C 356 358 368 340 366 318
        C 362 284 336 264 300 264
        C 288 240 264 228 238 230
        C 202 232 178 258 174 290
        C 152 298 142 324 152 358
        Z" />

      <!-- Capa 5: Reflejo especular -->
      <path fill="url(#clRim)" d="
        M 180 290
        C 182 264 204 240 236 238
        C 258 236 280 246 292 268
        C 264 256 226 264 200 286
        C 188 296 182 294 180 290
        Z" />
    </g>
  </g>

  <!-- ================= TEXTOS (DERECHA) ================= -->
  <g transform="translate(560, 195)">
    <!-- Badge -->
    <rect width="210" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="20" cy="18" r="5" fill="#38bdf8" />
    <text x="34" y="23" font-size="13" class="font-badge" letter-spacing="1">PREDICCIÓN OFICIAL</text>

    <!-- Título -->
    <text x="0" y="105" font-size="80" class="font-title" letter-spacing="-1.5">Pablómetro</text>

    <!-- Subtítulo -->
    <text x="0" y="162" font-size="24" class="font-sub">El tiempo oficial de la AEMET,</text>
    <text x="0" y="198" font-size="24" class="font-sub">pero con <tspan fill="#f8fafc" font-weight="600">buen gusto</tspan>.</text>

    <!-- Tags -->
    <text x="0" y="248" font-size="14" class="font-sub" fill="#64748b" letter-spacing="0.8">
      MINIMALISTA · ULTRALIGERO
    </text>
  </g>
</svg>